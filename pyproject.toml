[project]
name = "rag-api"
version = "1.0.0"
description = "FastAPI RAG service with Pinecone or pgvector retrieval, streamed Claude answers and an eval harness."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = ["integration: needs a real Postgres with pgvector (TEST_DATABASE_URL)"]
